# =============================================================================
# MCP Search - MySQL configuration (.properties form)
# Equivalent to examples/mysql/application.yml - see that file for full notes.
# Requires MySQL 9.0+ for the vector channel; a FULLTEXT index over text-columns;
# and the MySQL JDBC driver on the runtime classpath.
# =============================================================================

# --- DataSource (standard Spring Boot; the adapter reuses this connection) ---
spring.datasource.url=jdbc:mysql://localhost:3306/mydb
spring.datasource.username=myuser
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- MCP server transport (Spring AI) ---
spring.ai.mcp.server.name=mysql-search-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

# --- select the MySQL adapter ---
search.datasource.type=mysql

# --- MySQL adapter config ---
search.mysql.table=products
search.mysql.id-column=id
# text-columns must be covered by a FULLTEXT index:
#   ALTER TABLE products ADD FULLTEXT INDEX ft_products (title, body);
search.mysql.text-columns[0]=title
search.mysql.text-columns[1]=body
# vector-column must be a native VECTOR column (MySQL 9.0+), sized to your model:
#   ALTER TABLE products ADD COLUMN embedding VECTOR(1536);
# omit the next two lines for text-only search
search.mysql.vector-column=embedding
search.mysql.distance-metric=COSINE
# columns returned in each hit (omit for SELECT *)
search.mysql.select-columns[0]=id
search.mysql.select-columns[1]=title
search.mysql.select-columns[2]=price

# --- hybrid fusion ---
search.hybrid.default-mode=RRF
search.hybrid.default-alpha=0.5
search.hybrid.default-top-k=10

# --- MCP tool metadata (optional) ---
search.mcp.tool-name=search
search.mcp.tool-description=Hybrid full-text and semantic search over the configured datastore.
